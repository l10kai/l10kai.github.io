<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L10K</title>
<meta name="description" content="L10K — 正在酝酿新的故事">
<meta name="theme-color" content="#08080c">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2308080c'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23e0e8f0'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%237a8fa6' stroke-opacity='.5'/%3E%3C/svg%3E">
<script>document.documentElement.classList.add('js');</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #08080c;
    overflow: hidden;
  }

  body {
    color: #e0e8f0;
    font-family: "SF Pro Display", "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: rgba(122, 143, 166, 0.35); color: #e0e8f0; }

  /* ---------- Canvas ---------- */
  #cosmos {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
    background: #08080c;
  }

  /* ---------- Light sweep ---------- */
  .light-sweep {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.5s ease;
  }
  .light-sweep::before {
    content: "";
    position: absolute;
    top: -60vh;
    left: 0;
    width: clamp(160px, 28vw, 900px);
    height: 220vh;
    background: linear-gradient(90deg,
      rgba(122, 143, 166, 0) 0%,
      rgba(122, 143, 166, 0.045) 35%,
      rgba(224, 232, 240, 0.06) 50%,
      rgba(122, 143, 166, 0.045) 65%,
      rgba(122, 143, 166, 0) 100%);
    transform: translateX(calc(-30vw - 80vh)) rotate(18deg);
    will-change: transform;
  }
  .is-ambient .light-sweep { opacity: 1; }
  .is-ambient .light-sweep::before {
    animation: sweep 8s cubic-bezier(0.45, 0, 0.55, 1) 0.6s infinite;
  }
  .is-paused .light-sweep::before { animation-play-state: paused; }

  @keyframes sweep {
    0%   { transform: translateX(calc(-30vw - 80vh)) rotate(18deg); }
    38%  { transform: translateX(calc(100vw + 80vh)) rotate(18deg); }
    100% { transform: translateX(calc(100vw + 80vh)) rotate(18deg); }
  }

  /* ---------- Letterbox ---------- */
  .bar {
    position: fixed;
    left: 0;
    right: 0;
    height: 8vh;
    background: #08080c;
    z-index: 3;
    pointer-events: none;
    transition: transform 1s ease-out;
  }
  .bar-top { top: 0; }
  .bar-bottom { bottom: 0; }
  .bar::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      rgba(122, 143, 166, 0) 0%,
      rgba(122, 143, 166, 0.14) 50%,
      rgba(122, 143, 166, 0) 100%);
  }
  .bar-top::after { bottom: 0; }
  .bar-bottom::after { top: 0; }

  html.js .bar-top { transform: translateY(-100%); }
  html.js .bar-bottom { transform: translateY(100%); }
  html.js .is-bars .bar-top,
  html.js .is-bars .bar-bottom { transform: translateY(0); }

  /* ---------- Stage ---------- */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(8vh + 1rem) clamp(1rem, 4vw, 3rem);
    text-align: center;
    pointer-events: none;
  }

  .title {
    margin: 0;
    font-size: clamp(4rem, 14vw, 11rem);
    font-weight: 200;
    letter-spacing: 0.15em;
    padding-left: 0.15em; /* optically re-center trailing tracking */
    line-height: 1;
    color: #e0e8f0;
    text-shadow: 0 0 40px rgba(122, 143, 166, 0.22);
    white-space: nowrap;
    user-select: none;
  }
  .title span {
    display: inline-block;
  }
  html.js .title span {
    opacity: 0;
    transform: translateY(30px);
    filter: blur(12px);
    transition:
      opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
      filter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    transition-delay: calc(var(--i) * 150ms);
    will-change: opacity, transform, filter;
  }
  html.js .is-title .title span {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }

  .accent {
    width: min(200px, 40vw);
    height: 1px;
    margin-top: clamp(1.1rem, 3.2vh, 2.2rem);
    background: #7a8fa6;
    box-shadow: 0 0 8px rgba(122, 143, 166, 0.55);
    transform-origin: 50% 50%;
  }
  html.js .accent {
    transform: scaleX(0);
    transition: transform 1.2s ease-out;
  }
  html.js .is-line .accent { transform: scaleX(1); }

  .tagline {
    margin: clamp(1.1rem, 3.4vh, 2.2rem) 0 0;
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    font-weight: 300;
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    color: rgba(224, 232, 240, 0.7);
    line-height: 1.6;
  }
  html.js .tagline {
    opacity: 0;
    transform: translateY(15px);
    filter: blur(6px);
    transition:
      opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1),
      transform 1.2s cubic-bezier(0.16, 1, 0.3, 1),
      filter 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  html.js .is-tag .tagline {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }

  .contact {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.5rem clamp(0.6rem, 1.6vw, 1.1rem);
    margin-top: clamp(1.75rem, 6vh, 3.5rem);
    font-size: clamp(0.72rem, 1.5vw, 0.9rem);
    font-weight: 300;
    letter-spacing: 0.08em;
    pointer-events: auto;
  }
  html.js .contact {
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.5s ease, visibility 0s linear 1.5s;
  }
  html.js .is-contact .contact {
    opacity: 1;
    visibility: visible;
    transition: opacity 1.5s ease, visibility 0s linear 0s;
  }

  .contact a {
    color: #e0e8f0;
    text-decoration: none;
    opacity: 0.5;
    transition: opacity 0.45s ease;
    padding: 0.35em 0.15em;
    border-radius: 2px;
    outline: none;
    word-break: break-all;
  }
  .contact a:hover,
  .contact a:focus-visible { opacity: 0.85; }
  .contact a:focus-visible {
    box-shadow: 0 1px 0 0 #7a8fa6;
  }
  .contact .dot {
    color: #7a8fa6;
    opacity: 0.9;
    user-select: none;
  }

  @media (max-width: 440px) {
    .contact { flex-direction: column; gap: 0.25rem; }
    .contact .dot { display: none; }
  }

  @media (max-height: 420px) and (orientation: landscape) {
    .title { font-size: clamp(2.5rem, 22vh, 6rem); }
    .accent { margin-top: 0.8rem; }
    .tagline { margin-top: 0.8rem; }
    .contact { margin-top: 1rem; }
  }

  /* ---------- Final / reduced-motion state ---------- */
  .is-final *, .is-final *::before, .is-final *::after {
    transition: none !important;
    animation: none !important;
  }

  @media (prefers-reduced-motion: reduce) {
    html.js *, html.js *::before, html.js *::after {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
</head>
<body>
  <canvas id="cosmos" aria-hidden="true"></canvas>
  <div class="light-sweep" aria-hidden="true"></div>
  <div class="bar bar-top" aria-hidden="true"></div>
  <div class="bar bar-bottom" aria-hidden="true"></div>

  <main class="stage">
    <h1 class="title" aria-label="L10K"><span style="--i:0" aria-hidden="true">L</span><span style="--i:1" aria-hidden="true">1</span><span style="--i:2" aria-hidden="true">0</span><span style="--i:3" aria-hidden="true">K</span></h1>
    <div class="accent" aria-hidden="true"></div>
    <p class="tagline">正在酝酿新的故事</p>
    <nav class="contact" aria-label="Contact">
      <a href="mailto:linkai2005@gmail.com">linkai2005@gmail.com</a>
      <span class="dot" aria-hidden="true">·</span>
      <a href="https://github.com/l10kai" target="_blank" rel="noopener">https://github.com/l10kai</a>
    </nav>
  </main>

<script>
(function () {
  'use strict';

  var doc = document;
  var body = doc.body;
  var canvas = doc.getElementById('cosmos');
  var ctx = canvas && canvas.getContext ? canvas.getContext('2d', { alpha: false }) : null;

  var ALL_STATES = ['is-bars', 'is-title', 'is-line', 'is-tag', 'is-contact'];

  if (!ctx) {
    body.classList.add('is-final');
    ALL_STATES.forEach(function (c) { body.classList.add(c); });
    return;
  }

  /* ---------- Constants ---------- */
  var TAU = Math.PI * 2;
  var BG = '#08080c';
  var WHITE = 'rgb(224,232,240)';
  var SILVER = 'rgb(122,143,166)';
  var COUNT = 300;

  var T = {
    core: 0.8,
    glow: 2.0,
    burst: 2.5,
    settle: 4.5,
    bars: 6.5,
    title: 7.5,
    line: 8.5,
    tag: 10.5,
    contact: 12.0,
    land: 13.5
  };

  var CUES = [
    { t: T.bars, c: 'is-bars' },
    { t: T.title, c: 'is-title' },
    { t: T.line, c: 'is-line' },
    { t: T.tag, c: 'is-tag' },
    { t: T.contact, c: 'is-contact' }
  ];

  /* ---------- State ---------- */
  var vw = 0, vh = 0, dpr = 1;
  var particles = [], whites = [], silvers = [];
  var clock = 0, last = 0, rafId = 0, cueIdx = 0;
  var loop = null;
  var mode = 'film'; // 'film' | 'ambient' | 'static'
  var resizeRaf = 0;

  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;

  /* ---------- Helpers ---------- */
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function smooth(a, b, x) { var t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); }
  function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
  function easeOutCubic(t) { var u = 1 - t; return 1 - u * u * u; }

  function clearBg() {
    ctx.globalAlpha = 1;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, vw, vh);
  }

  /* ---------- Sizing ---------- */
  function resize() {
    var ow = vw || window.innerWidth;
    var oh = vh || window.innerHeight;
    vw = Math.max(1, window.innerWidth);
    vh = Math.max(1, window.innerHeight);
    dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1), 3);

    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';

    if (particles.length && (ow !== vw || oh !== vh)) {
      var fx = vw / ow, fy = vh / oh;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x *= fx; p.y *= fy;
        p.px *= fx; p.py *= fy;
        p.tx *= fx; p.ty *= fy;
        p.ox *= fx; p.oy *= fy;
        p.sx = vw / 2; p.sy = vh / 2;
      }
    }
  }

  /* ---------- Particles ---------- */
  function initParticles() {
    particles = []; whites = []; silvers = [];
    var cx = vw / 2, cy = vh / 2;
    for (var i = 0; i < COUNT; i++) {
      var silver = Math.random() < 0.2;
      var p = {
        x: cx, y: cy, px: cx, py: cy,
        sx: cx, sy: cy,
        tx: rand(0, vw), ty: rand(0, vh),
        ox: 0, oy: 0,
        vx: rand(-0.1, 0.1), vy: rand(-0.1, 0.1),
        r: 0.5 + 1.5 * Math.pow(Math.random(), 2.2),
        a: rand(0.35, 0.92),
        bs: rand(0.45, 1.4),
        ph: rand(0, TAU),
        d: rand(1.5, 2.0),
        fade: 0,
        tw: -1
      };
      particles.push(p);
      (silver ? silvers : whites).push(p);
    }
  }

  function wrap(p) {
    var m = 4;
    if (p.x < -m) { p.x += vw + 2 * m; p.px = p.x; }
    else if (p.x > vw + m) { p.x -= vw + 2 * m; p.px = p.x; }
    if (p.y < -m) { p.y += vh + 2 * m; p.py = p.y; }
    else if (p.y > vh + m) { p.y -= vh + 2 * m; p.py = p.y; }
  }

  function burstUpdate(t, k) {
    var e0 = t - T.burst;
    for (var i = 0; i < COUNT; i++) {
      var p = particles[i];
      p.px = p.x; p.py = p.y;
      p.ox += p.vx * k; p.oy += p.vy * k;
      var u = clamp01(e0 / p.d);
      var e = easeOutExpo(u);
      p.x = p.sx + (p.tx - p.sx) * e + p.ox;
      p.y = p.sy + (p.ty - p.sy) * e + p.oy;
      p.fade = Math.min(1, 0.4 + u * 3);
    }
  }

  function driftUpdate(k, dt) {
    for (var i = 0; i < COUNT; i++) {
      var p = particles[i];
      p.x += p.vx * k;
      p.y += p.vy * k;
      p.px = p.x; p.py = p.y;
      p.fade = 1;
      wrap(p);
    }
    if (Math.random() < dt * 1.6) {
      var q = particles[(Math.random() * COUNT) | 0];
      if (q.tw < 0) q.tw = clock;
    }
  }

  function drawGroup(group, color, streaks, breathe) {
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    for (var i = 0; i < group.length; i++) {
      var p = group[i];
      var a = p.a * p.fade;
      if (breathe) a *= 0.65 + 0.35 * Math.sin(clock * p.bs + p.ph);
      var r = p.r;

      if (p.tw >= 0) {
        var u = (clock - p.tw) / 0.3;
        if (u >= 1 || u < 0) { p.tw = -1; }
        else {
          var b = Math.sin(Math.PI * u);
          r *= 1 + 2 * b;
          a += (1 - a) * b;
        }
      }
      if (a <= 0.004) continue;

      if (streaks) {
        var dx = p.x - p.px, dy = p.y - p.py;
        if (dx * dx + dy * dy > 4) {
          ctx.globalAlpha = a * 0.45;
          ctx.lineWidth = r;
          ctx.beginPath();
          ctx.moveTo(p.x - dx * 1.6, p.y - dy * 1.6);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
      }

      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, TAU);
      ctx.fill();
    }
  }

  function drawParticles(streaks, breathe) {
    drawGroup(whites, WHITE, streaks, breathe);
    drawGroup(silvers, SILVER, streaks, breathe);
    ctx.globalAlpha = 1;
  }

  /* ---------- Act I core ---------- */
  function drawCore(t) {
    var cx = vw / 2, cy = vh / 2, g;

    // Expanding radial glow (2.0s →)
    if (t >= T.glow) {
      var gr = 80 * easeOutCubic(clamp01((t - T.glow) / 1.0));
      var ga = 1 - smooth(2.7, 3.4, t);
      if (gr > 0.5 && ga > 0) {
        g = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr);
        g.addColorStop(0, 'rgba(122,143,166,0.35)');
        g.addColorStop(1, 'rgba(122,143,166,0)');
        ctx.globalAlpha = ga;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, gr, 0, TAU);
        ctx.fill();
      }
    }

    // Burst flash + shockwave (2.5s → 3.3s)
    if (t >= T.burst && t < T.burst + 0.8) {
      var u = (t - T.burst) / 0.8;
      var fr = 30 + 50 * u;
      g = ctx.createRadialGradient(cx, cy, 0, cx, cy, fr);
      g.addColorStop(0, 'rgba(224,232,240,0.55)');
      g.addColorStop(0.35, 'rgba(122,143,166,0.18)');
      g.addColorStop(1, 'rgba(122,143,166,0)');
      ctx.globalAlpha = 1 - u;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, fr, 0, TAU);
      ctx.fill();

      var rr = easeOutExpo(u) * Math.min(vw, vh) * 0.38;
      ctx.globalAlpha = (1 - u) * 0.3;
      ctx.strokeStyle = SILVER;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, TAU);
      ctx.stroke();
    }

    // Central breathing point (0.8s →, crossfades out 2.5s → 3.2s)
    var fade = smooth(T.core, T.core + 0.7, t) * (1 - smooth(T.burst, 3.2, t));
    if (fade > 0) {
      var s = 1.15 - 0.15 * Math.cos(TAU * (t - T.core) / 1.5);
      var hr = 7 * s;
      g = ctx.createRadialGradient(cx, cy, 0, cx, cy, hr);
      g.addColorStop(0, 'rgba(224,232,240,0.28)');
      g.addColorStop(1, 'rgba(224,232,240,0)');
      ctx.globalAlpha = fade;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, hr, 0, TAU);
      ctx.fill();

      ctx.fillStyle = WHITE;
      ctx.beginPath();
      ctx.arc(cx, cy, 1.5 * s, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- Clock (pause-safe) ---------- */
  function step(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt < 0) dt = 0;
    if (dt > 0.1) dt = 0.1;
    clock += dt;
    return dt;
  }

  function runCues(t) {
    while (cueIdx < CUES.length && t >= CUES[cueIdx].t) {
      body.classList.add(CUES[cueIdx].c);
      cueIdx++;
    }
  }

  /* ---------- Film timeline loop ---------- */
  function timeline(now) {
    var dt = step(now);
    var t = clock;
    var k = dt * 60;

    runCues(t);
    clearBg();

    if (t < 3.5) drawCore(t);

    if (t >= T.burst) {
      if (t < T.settle) {
        burstUpdate(t, k);
        drawParticles(true, true);
      } else {
        driftUpdate(k, dt);
        drawParticles(false, true);
      }
    }

    if (t >= T.land) {
      enterAmbient();
      return;
    }
    rafId = requestAnimationFrame(timeline);
  }

  /* ---------- Ambient loop (no timeline checks) ---------- */
  function ambient(now) {
    var dt = step(now);
    driftUpdate(dt * 60, dt);
    clearBg();
    drawParticles(false, true);
    rafId = requestAnimationFrame(ambient);
  }

  function enterAmbient() {
    cueIdx = CUES.length;
    ALL_STATES.forEach(function (c) { body.classList.add(c); });
    body.classList.add('is-ambient');
    mode = 'ambient';
    loop = ambient;
    rafId = requestAnimationFrame(ambient);
  }

  /* ---------- Static (reduced motion) ---------- */
  function drawStatic() {
    clearBg();
    drawParticles(false, false);
  }

  function goStatic() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    mode = 'static';
    body.classList.add('is-final');
    ALL_STATES.forEach(function (c) { body.classList.add(c); });
    body.classList.remove('is-ambient');
    var settled = clock >= T.settle;
    for (var i = 0; i < COUNT; i++) {
      var p = particles[i];
      if (!settled) { p.x = p.tx; p.y = p.ty; }
      p.px = p.x; p.py = p.y;
      p.fade = 1;
      p.tw = -1;
    }
    drawStatic();
  }

  function repaintNow() {
    if (mode === 'static') { drawStatic(); return; }
    clearBg();
    if (mode === 'film' && clock < 3.5) drawCore(clock);
    if (clock >= T.burst) drawParticles(false, true);
  }

  /* ---------- Events ---------- */
  window.addEventListener('resize', function () {
    if (resizeRaf) return;
    resizeRaf = requestAnimationFrame(function () {
      resizeRaf = 0;
      resize();
      repaintNow();
    });
  }, { passive: true });

  doc.addEventListener('visibilitychange', function () {
    if (mode === 'static') return;
    if (doc.hidden) {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
      body.classList.add('is-paused');
    } else {
      body.classList.remove('is-paused');
      last = 0; // resume without a time skip
      if (!rafId && loop) rafId = requestAnimationFrame(loop);
    }
  });

  if (mq) {
    var onMq = function (e) { if (e.matches && mode !== 'static') goStatic(); };
    if (mq.addEventListener) mq.addEventListener('change', onMq);
    else if (mq.addListener) mq.addListener(onMq);
  }

  /* ---------- Boot ---------- */
  resize();
  initParticles();
  clearBg();

  if (mq && mq.matches) {
    goStatic();
  } else {
    loop = timeline;
    if (doc.hidden) body.classList.add('is-paused');
    else rafId = requestAnimationFrame(timeline);
  }
})();
</script>
</body>
</html>
